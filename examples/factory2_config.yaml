# Factory 2 config — AnyLogic Electronics Sample Dataset
# Source file: anylogic_electronics_sample_dataset/routing_operations.csv
#
# This dataset is CSV-based and already has cycle times in min/unit.
# There is no ZBS column — the "process_time_type" column plays that role.
# There is no site column — site_filter is disabled (value: null).

columns:
  part_id:              "product_id"
  part_name:            "product_id"       # no separate name column; reuse ID
  routing_step:         "operation_seq"
  routing_plan:         "routing_id"
  routing_plan_version: "revision"
  operation_name:       "operation_name"
  cost_center:          "resource_group"   # already descriptive (e.g. SMT_PRINTER)
  machine_id:           "resource_group"   # no per-row machine ID in routing file
  calc_rate:            "run_time_min_per_unit"   # already in min/piece
  zbs:                  "process_time_type"
  site:                 "product_id"       # unused placeholder — filter disabled below

# Disable site filter (no plant column in this dataset)
site_filter:
  value: null

skip_operation_names: []   # no admin-note rows in this dataset

# process_time_type values found in the dataset:
#   "per_unit_plus_batch" — most operations
#   "per_unit"            — simple operations
# Both use run_time_min_per_unit which is already in min/piece → divisor=1, multiplier=1
zbs_rules:
  skip_values: []
  conversions:
    "per_unit_plus_batch":
      description: "run_time_min_per_unit is already min/piece"
      divisor: 1
      multiplier: 1
    "per_unit":
      description: "run_time_min_per_unit is already min/piece"
      divisor: 1
      multiplier: 1

# Note: setup_time_min_default is a column in routing_operations.csv but is not
# read here — it is left as 0.0 default. To populate it, add a post-processing
# step that joins setup_time_min_default into the Routing sheet by operation_id.
defaults:
  required_skill:              ""     # see required_skill_group column for future mapping
  setup_time_min:              0.0    # actual values in setup_time_min_default column
  batch_overhead_min:          0.0    # batch_time_min column available if needed
  batch_size:                  1      # batch_size_qty column available if needed
  yield_pct:                   100.0  # actual values in yield_pct column (see note)
  scrap_or_rework:             ""
  transport_time_min:          0.0
  staffing_factor_per_machine: 1.0   # actual values in staffing_factor_per_machine column
  operator_attention_factor:   1.0   # actual values in operator_attention_factor column
